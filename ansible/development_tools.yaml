---
- name: install development tools
  hosts: new_installation

  vars:
    python_modules:
      - natsort
      - openpyxl
      - pandas
      - poetry-dotenv-plugin
      - pycryptodome
      - python-dotenv

  tasks:
    - name: check if Pyenv is installed
      ansible.builtin.stat:
        path: "/home/{{ ansible_user }}/.pyenv"
      register: pyenv

    - name: install Pyenv
      ansible.builtin.shell: |
        curl -fsSL https://pyenv.run | bash
      when: not pyenv.stat.exists

    - name: install Poetry
      community.general.pipx:
        name: poetry

    - name: configure Poetry
      ansible.builtin.shell: |
        /home/{{ ansible_user }}/.local/bin/poetry config virtualenvs.in-project true

    - name: install Python modules
      ansible.builtin.pip:
        name: "{{ python_modules }}"

    - name: install Rich
      community.general.pipx:
        name: rich-cli

    - name: install Docker natively, via Moby Engine
      ansible.builtin.dnf5:
        name:
          - moby-engine
          - docker-compose
        state: present
      become: yes

    - name: add the user to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
      become: yes

    - name: enable and start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes
      become: yes

    - name: download and install Minikube
      ansible.builtin.get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /usr/local/bin/minikube
        mode: "0755"
        owner: root
        group: root
      become: yes

    - name: create wrapper script for MySQL (bypass MariaDB warning)
      ansible.builtin.copy:
        dest: "/home/{{ ansible_user }}/.local/bin/mysql"
        mode: "0755"
        content: |
          #!/bin/bash
          # Pass all arguments directly to mariadb to avoid the deprecation warning
          exec /usr/bin/mariadb "$@"
      become: no

    - name: create a wrapper for sqlcmd
      ansible.builtin.copy:
        dest: /home/{{ ansible_user }}/.local/bin/sqlcmd
        mode: "0755"
        content: |
          #!/bin/bash
          # Intercept Dadbod's sqlcmd call and force Trust Server Certificate (-C)
          /opt/mssql-tools18/bin/sqlcmd -C -No "$@"

    - name: install repomix tool
      community.general.npm:
        name: repomix
        global: true
        state: present
      become: yes

    - name: add Claude Code RPM repository
      ansible.builtin.yum_repository:
        name: claude-code
        description: Claude Code Official Repo
        baseurl: https://downloads.claude.ai/claude-code/rpm/stable
        enabled: yes
        gpgcheck: yes
        gpgkey: https://downloads.claude.ai/keys/claude-code.asc
        state: present
      become: yes

    - name: install Claude Code
      ansible.builtin.dnf5:
        name: claude-code
        state: present
      become: yes

    - name: import the tenv repository signing key
      ansible.builtin.rpm_key:
        key: https://dl.cloudsmith.io/public/tofuutils/tenv/gpg.8ACD4386ADD982F6.key
        state: present
      become: yes

    - name: add the tenv repository
      ansible.builtin.yum_repository:
        name: tofuutils-tenv
        description: tofuutils-tenv
        baseurl: https://dl.cloudsmith.io/public/tofuutils/tenv/rpm/fedora/$releasever/$basearch
        gpgkey: https://dl.cloudsmith.io/public/tofuutils/tenv/gpg.8ACD4386ADD982F6.key
        gpgcheck: true
        repo_gpgcheck: true
        enabled: true
        # No sslcacert: dnf uses the system trust store
      become: yes

    - name: install tenv
      ansible.builtin.package:
        name: tenv
        state: present
      become: yes

    - name: install the latest Terraform with tenv
      ansible.builtin.command:
        cmd: "tenv tf install latest"
      register: terraform_install
      changed_when: "'already installed' not in (terraform_install.stdout + terraform_install.stderr)"

    - name: set the default Terraform version
      ansible.builtin.command:
        cmd: "tenv tf use latest"
      changed_when: false

    - name: install Terragrunt with tenv
      ansible.builtin.command:
        cmd: "tenv tg install latest"
      register: terragrunt_install
      changed_when: "'already installed' not in (terragrunt_install.stdout + terragrunt_install.stderr)"

    - name: set the default Terragrunt version
      ansible.builtin.command:
        cmd: "tenv tg use latest"
      changed_when: false
