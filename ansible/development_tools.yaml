---
- name: install development tools
  hosts: new_installation

  vars:
    python_modules:
      - natsort
      - openpyxl
      - pandas
      - poetry-dotenv-plugin
      - pycryptodome
      - python-dotenv

  tasks:
    - name: check if Pyenv is installed
      ansible.builtin.stat:
        path: "/home/{{ ansible_user }}/.pyenv"
      register: pyenv

    - name: install Pyenv
      ansible.builtin.shell: |
        curl -fsSL https://pyenv.run | bash
      when: not pyenv.stat.exists

    - name: install Poetry
      community.general.pipx:
        name: poetry

    - name: configure Poetry
      ansible.builtin.shell: |
        /home/{{ ansible_user }}/.local/bin/poetry config virtualenvs.in-project true

    - name: install Python modules
      ansible.builtin.pip:
        name: "{{ python_modules }}"

    - name: install Rich
      community.general.pipx:
        name: rich-cli

    - name: install Docker natively, via Moby Engine
      ansible.builtin.dnf5:
        name:
          - moby-engine
          - docker-compose
        state: present
      become: yes
      environment:
        http_proxy: http://127.0.0.1:8888
        https_proxy: http://127.0.0.1:8888

    - name: add the user to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
      become: yes

    - name: enable and start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes
      become: yes

    - name: download and install Minikube
      ansible.builtin.get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /usr/local/bin/minikube
        mode: "0755"
        owner: root
        group: root
      become: yes
      environment:
        http_proxy: http://127.0.0.1:8888
        https_proxy: http://127.0.0.1:8888

    - name: create wrapper script for MySQL (bypass MariaDB warning)
      ansible.builtin.copy:
        dest: "/home/{{ ansible_user }}/.local/bin/mysql"
        mode: "0755"
        content: |
          #!/bin/bash
          # Pass all arguments directly to mariadb to avoid the deprecation warning
          exec /usr/bin/mariadb "$@"
      become: no

    - name: create a wrapper for sqlcmd
      ansible.builtin.copy:
        dest: /home/{{ ansible_user }}/.local/bin/sqlcmd
        mode: "0755"
        content: |
          #!/bin/bash
          # Intercept Dadbod's sqlcmd call and force Trust Server Certificate (-C)
          /opt/mssql-tools18/bin/sqlcmd -C -No "$@"

    - name: install repomix tool
      community.general.npm:
        name: repomix
        global: true
        state: present
      become: yes

    - name: add Claude Code RPM repository
      ansible.builtin.yum_repository:
        name: claude-code
        description: Claude Code Official Repo
        baseurl: https://downloads.claude.ai/claude-code/rpm/stable
        enabled: yes
        gpgcheck: yes
        gpgkey: https://downloads.claude.ai/keys/claude-code.asc
        state: present
      become: yes
      environment:
        http_proxy: http://127.0.0.1:8888
        https_proxy: http://127.0.0.1:8888

    - name: install Claude Code
      ansible.builtin.dnf5:
        name: claude-code
        state: present
      become: yes
      environment:
        http_proxy: http://127.0.0.1:8888
        https_proxy: http://127.0.0.1:8888
