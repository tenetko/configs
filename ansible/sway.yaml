---
- name: install sway
  hosts: new_installation
  become: yes

  vars:
    sway:
      - fuzzel
      - greetd
      - swappy
      - sway
      - swaybg
      - waybar

  tasks:
    - name: install sway
      ansible.builtin.dnf5:
        name: "{{ sway }}"
        state: present
      environment:
        http_proxy: http://127.0.0.1:8888
        https_proxy: http://127.0.0.1:8888

    - name: enable hyprlock COPR repository
      community.general.copr:
        name: lionheartp/Hyprland
        state: enabled
      environment:
        http_proxy: http://127.0.0.1:8888
        https_proxy: http://127.0.0.1:8888

    - name: install hyprlock
      ansible.builtin.dnf5:
        name: hyprlock
        state: present
      environment:
        http_proxy: http://127.0.0.1:8888
        https_proxy: http://127.0.0.1:8888

    # - name: cron job for wallpaper
    #   ansible.builtin.cron:
    #     name: "rotate wallpaper"
    #     minute: "*/10"
    #     job: "/home/{{ ansible_user }}/.config/sway/rotate_wallpaper.sh"
    #   become: no

    - name: clone sway-audio-idle-inhibit
      ansible.builtin.git:
        repo: https://github.com/ErikReider/SwayAudioIdleInhibit.git
        dest: /tmp/sway-audio-idle-inhibit
        version: main
        force: yes

    - name: build and install sway-audio-idle-inhibit
      ansible.builtin.shell: |
        meson setup build
        ninja -C build
        ninja -C build install
      args:
        chdir: /tmp/sway-audio-idle-inhibit
        creates: /usr/local/bin/sway-audio-idle-inhibit

    - name: cleanup build directory
      ansible.builtin.file:
        path: /tmp/sway-audio-idle-inhibit
        state: absent

    - name: clone awww
      ansible.builtin.git:
        repo: https://codeberg.org/LGFae/awww
        dest: /tmp/awww
        version: main
        force: yes

    - name: build awww
      ansible.builtin.shell: |
        cargo build --release
      args:
        chdir: /tmp/awww

    - name: install awww
      ansible.builtin.copy:
        src: "/tmp/awww/target/release/{{ item }}"
        dest: /usr/local/bin/{{ item }}
        remote_src: yes
        mode: "0755"
      loop:
        - awww
        - awww-daemon

    - name: cleanup build directory
      ansible.builtin.file:
        path: /tmp/awww
        state: absent

    - name: Ensure systemd logind drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/logind.conf.d
        state: directory
        mode: "0755"

    - name: Configure systemd to ignore lid switch when HDMI is connected
      ansible.builtin.copy:
        dest: /etc/systemd/logind.conf.d/10-lid-switch.conf
        content: |
          [Login]
          HandleLidSwitchDocked=ignore
          # If it still sleeps with HDMI plugged in, uncomment the line below to force it globally:
          # HandleLidSwitch=ignore
      notify: restart systemd-logind

    - name: enable mystical-devil/ReGreet COPR repository
      community.general.copr:
        name: mystical-devil/ReGreet
        state: enabled

    - name: install ReGreet
      ansible.builtin.dnf5:
        name:
          - ReGreet
        state: present

  handlers:
    - name: restart systemd-logind
      ansible.builtin.systemd:
        name: systemd-logind
        state: restarted
